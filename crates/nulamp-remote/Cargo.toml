[package]
name = "nulamp-remote"
description = "Single instance, command line, remote control and OS integration"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
interprocess = "2.4.5"
log = "0.4.34"
nulamp-core = { version = "0.4.0", path = "../nulamp-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
thiserror = "2.0.21"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }

[lints]
workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly"))'.dependencies]
zbus = "5.19"
