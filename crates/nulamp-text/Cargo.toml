[package]
name = "nulamp-text"
description = "1-bit (non-antialiased) text rendering, font resolution and shaping"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fontdb = "0.24.0"
freetype-rs = "0.38.0"
nulamp-skin = { version = "0.6.0", path = "../nulamp-skin" }
rustybuzz = "0.20.1"
unicode-bidi = "0.3.18"

# Windows has no system FreeType: build the bundled copy there.
[target.'cfg(windows)'.dependencies]
freetype-rs = { version = "0.38.0", features = ["bundled"] }

[lints]
workspace = true
