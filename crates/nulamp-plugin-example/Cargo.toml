[package]
name = "nulamp-plugin-example"
description = "Example native plugin: gain, vocal remover and half-speed effects, and an event logger"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
# `cdylib` is the plugin file; `rlib` lets tests link it as a built-in plugin.
crate-type = ["cdylib", "rlib"]

[dependencies]
nulamp-plugin-api = { version = "0.2.0", path = "../nulamp-plugin-api", default-features = false }

[lints]
workspace = true
