[package]
name = "nulamp-plugin-api"
description = "Plugin interfaces and loader"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["host"]
# The loader and the adapters into the player. Plugin authors only need the `sys` module and
# depend on this crate with `default-features = false`.
host = [
    "dep:libloading",
    "dep:log",
    "dep:nulamp-audio",
    "dep:nulamp-core",
    "dep:nulamp-decoders",
    "dep:nulamp-vis",
    "dep:thiserror",
]

[dependencies]
libloading = { version = "0.8.9", optional = true }
log = { version = "0.4.34", optional = true }
nulamp-audio = { version = "0.5.0", path = "../nulamp-audio", optional = true }
nulamp-core = { version = "0.5.0", path = "../nulamp-core", optional = true }
nulamp-decoders = { version = "0.5.0", path = "../nulamp-decoders", optional = true }
nulamp-vis = { version = "0.5.0", path = "../nulamp-vis", optional = true }
thiserror = { version = "2.0.21", optional = true }

[dev-dependencies]
# Built before the tests so that `tests/example_plugin.rs` finds its shared library.
nulamp-plugin-example = { version = "0.5.0", path = "../nulamp-plugin-example" }

[lints]
workspace = true
