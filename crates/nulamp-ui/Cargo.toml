[package]
name = "nulamp-ui"
description = "Window manager, input handling, docking and platform layer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
log = "0.4.34"
nulamp-core = { version = "0.1.0", path = "../nulamp-core" }
nulamp-eq = { version = "0.1.0", path = "../nulamp-eq" }
nulamp-meta = { version = "0.1.0", path = "../nulamp-meta" }
nulamp-pixelfont = { version = "0.1.0", path = "../nulamp-pixelfont" }
nulamp-playlist = { version = "0.1.0", path = "../nulamp-playlist" }
nulamp-render = { version = "0.1.0", path = "../nulamp-render" }
nulamp-skin = { version = "0.1.0", path = "../nulamp-skin" }
nulamp-skinui = { version = "0.1.0", path = "../nulamp-skinui" }
nulamp-text = { version = "0.1.0", path = "../nulamp-text" }
nulamp-vis = { version = "0.1.0", path = "../nulamp-vis" }
rand = "0.9"
raw-window-handle = "0.6"
rfd = "0.17.2"
softbuffer = "0.4"
winit = "0.30"

[lints]
workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13", features = ["shape", "allow-unsafe-code"] }
