[package]
name = "nulamp-library"
description = "Media library provider interface, local SQLite provider and Jellyfin provider"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
log = "0.4.34"
notify = "8.2.0"
nulamp-core = { version = "0.6.0", path = "../nulamp-core" }
nulamp-meta = { version = "0.6.0", path = "../nulamp-meta" }
nulamp-tf = { version = "0.6.0", path = "../nulamp-tf" }
rusqlite = { version = "0.40.2", features = ["bundled", "functions", "collation"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
thiserror = "2.0.21"
ureq = "3.1.4"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
