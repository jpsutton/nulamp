[package]
name = "nulamp-decoders"
description = "Decoder modules and stream input"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
log = "0.4.34"
ogg = "0.9.2"
opusic-sys = "0.7.5"
rustysynth = "1.3.7"
symphonia = { version = "0.6.1", features = ["all-codecs", "all-formats", "opt-simd"] }
thiserror = "2.0.21"

[build-dependencies]
pkg-config = "0.3.34"

[features]
default = ["openmpt"]
# Tracker modules through the system libopenmpt (found with pkg-config).
openmpt = []

[lints]
workspace = true
