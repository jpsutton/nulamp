[package]
name = "nulamp-decoders"
description = "Decoder modules and stream input"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
encoding_rs = "0.8.42"
log = "0.4.34"
ogg = "0.9.2"
opusic-sys = "0.7.5"
rustysynth = "1.3.7"
nulamp-playlist = { version = "0.6.0", path = "../nulamp-playlist" }
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12", "ring", "logging"] }
symphonia = { version = "0.6.1", features = ["all-codecs", "all-formats", "opt-simd"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
webpki-roots = "1.0.9"

[build-dependencies]
cc = "1.7.0"
pkg-config = "0.3.34"

[features]
default = ["openmpt", "ffmpeg"]
# Tracker modules through the system libopenmpt (found with pkg-config).
openmpt = []
# Audio CD playback through the system libcdio (found with pkg-config). Off by default because
# libcdio is GPL-3.0-or-later: a binary built with it must be distributed under the GPL.
cdio = []
# WMA, WavPack, Monkey's Audio, Musepack and TTA (and a fallback for other files) through the
# system FFmpeg libraries (found with pkg-config, or FFMPEG_DIR), linked dynamically.
ffmpeg = []

[lints]
workspace = true
