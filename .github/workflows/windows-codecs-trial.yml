# TEMPORARY: validates the Windows codec build on this branch; removed before merging.
name: Windows codecs trial
on:
  push:
    branches: ["feat/windows-codecs"]
jobs:
  trial:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: zlib headers for the bundled FreeType
        shell: bash
        run: ./scripts/windows-zlib.sh --release
      - name: Restore the codec library cache
        uses: actions/cache/restore@v4
        with:
          path: codecs/cache
          key: vcpkg-codecs-${{ hashFiles('scripts/windows-codecs-versions.sh') }}
      - name: FFmpeg and libopenmpt
        shell: bash
        run: ./scripts/windows-codecs.sh codecs
      # Saved even when a later step fails: the first build takes about 25 minutes.
      - name: Save the codec library cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: codecs/cache
          key: vcpkg-codecs-${{ hashFiles('scripts/windows-codecs-versions.sh') }}
      - uses: Swatinem/rust-cache@v2
      - name: ffmpeg tool for test fixtures
        run: choco install ffmpeg -y --no-progress
      - name: Build
        run: cargo build --release --locked -p nulamp
      - name: Decoder tests
        run: cargo test --release -p nulamp-decoders -- --nocapture
      - name: Package
        shell: bash
        run: |
          name=nulamp-trial-x86_64-pc-windows-msvc
          mkdir -p "dist/$name/plugin-sdk"
          cp target/release/nulamp.exe README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cp include/nulamp_plugin.h docs/plugins.md "dist/$name/plugin-sdk/"
          ./scripts/windows-codecs.sh codecs "dist/$name"
          ls -la "dist/$name" "dist/$name/third-party" dist
          tar -tzvf dist/*-lgpl-sources.tar.gz
      - name: Installer
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsis\makensis.exe")) { choco install nsis -y --no-progress }
          $src = "$PWD\dist\nulamp-trial-x86_64-pc-windows-msvc"
          & "$nsis\makensis.exe" -V2 "-DVERSION=0.0.0" "-DSRCDIR=$src" "-DOUTFILE=$PWD\dist\nulamp-trial-setup.exe" packaging\windows\nulamp.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Silent per-user install, start check, uninstall.
          Start-Process "$PWD\dist\nulamp-trial-setup.exe" -ArgumentList "/S" -Wait
          $dir = "$env:LOCALAPPDATA\Programs\nulamp"
          Get-ChildItem $dir -Recurse | Select-Object -ExpandProperty FullName
          $p = Start-Process "$dir\nulamp.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "nulamp exited with $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id
          Start-Sleep -Seconds 1
          Start-Process "$dir\uninstall.exe" -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $dir) { Get-ChildItem $dir -Recurse | Select-Object -ExpandProperty FullName }
      - name: Linked DLLs
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -like '*Hostx64\x64*' } | Select-Object -First 1
          & $dumpbin.FullName /dependents target\release\nulamp.exe
      - uses: actions/upload-artifact@v4
        with:
          name: trial
          path: |
            dist/nulamp-trial-setup.exe
            dist/nulamp-trial-x86_64-pc-windows-msvc
            dist/*-lgpl-sources.tar.gz
