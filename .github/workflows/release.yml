# Build and publish a release whenever the release branch moves.
name: Release

on:
  push:
    branches: ["release"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        name: Version from Cargo.toml
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::error::Tag v$version already exists. Bump the workspace version before releasing."
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install system libraries
        shell: bash
        run: ./scripts/ci-deps.sh
      - name: zlib headers for the bundled FreeType (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./scripts/windows-zlib.sh --release --target ${{ matrix.target }}
      - name: Restore the codec library cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: codecs/cache
          key: vcpkg-codecs-${{ hashFiles('scripts/windows-codecs-versions.sh') }}
      - name: FFmpeg and libopenmpt (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./scripts/windows-codecs.sh codecs
      # Saved even when a later step fails: the first build takes about 25 minutes.
      - name: Save the codec library cache (Windows)
        if: always() && runner.os == 'Windows'
        uses: actions/cache/save@v4
        with:
          path: codecs/cache
          key: vcpkg-codecs-${{ hashFiles('scripts/windows-codecs-versions.sh') }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p nulamp --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="nulamp-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin="target/${{ matrix.target }}/release/nulamp"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            # The codec DLLs, their licences and the LGPL sources (dist/$name-lgpl-sources.tar.gz).
            ./scripts/windows-codecs.sh codecs "dist/$name"
          fi
          mkdir -p "dist/$name/plugin-sdk"
          cp include/nulamp_plugin.h docs/plugins.md "dist/$name/plugin-sdk/"
          cd dist
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsis\makensis.exe")) { choco install nsis -y --no-progress }
          $v = "${{ needs.version.outputs.version }}"
          $src = "$PWD\dist\nulamp-$v-${{ matrix.target }}"
          & "$nsis\makensis.exe" -V2 "-DVERSION=$v" "-DSRCDIR=$src" "-DOUTFILE=$PWD\dist\nulamp-$v-windows-x86_64-setup.exe" packaging\windows\nulamp.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: nulamp-${{ matrix.target }}
          path: |
            dist/*.${{ matrix.archive }}
            dist/*-setup.exe
            dist/*-lgpl-sources.tar.gz

  appimage:
    name: Build (Linux AppImage)
    needs: [version]
    # The oldest supported Ubuntu sets the glibc the AppImage needs (2.39).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system libraries
        # Not the distribution's FFmpeg or libopenmpt: the binary must link the bundled builds.
        run: |
          NULAMP_NO_CODEC_DEV=1 ./scripts/ci-deps.sh
          sudo apt-get install -y --no-install-recommends nasm
      - uses: Swatinem/rust-cache@v2
      - name: Build the bundled LGPL FFmpeg and libopenmpt
        run: ./scripts/appimage/build-deps.sh
      - name: Build the AppImage
        run: ./scripts/appimage/build-appimage.sh
      - name: Plugin SDK
        run: |
          name="nulamp-${{ needs.version.outputs.version }}-plugin-sdk"
          mkdir -p "dist/$name"
          cp include/nulamp_plugin.h docs/plugins.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: nulamp-linux-appimage
          path: |
            dist/*.AppImage
            dist/ffmpeg-*.tar.xz
            dist/*-plugin-sdk.tar.gz

  deb:
    name: Build (Ubuntu ${{ matrix.ubuntu }} .deb)
    needs: [version]
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        # Supported LTS releases and the newest release.
        ubuntu: ["24.04", "26.04"]
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/packages/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nulamp-deb-${{ matrix.ubuntu }}
          path: dist/*.deb

  arch:
    name: Build (Arch Linux package)
    needs: [version]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/packages/build-arch.sh
        env:
          NULAMP_SIGNING_KEY: ${{ secrets.NULAMP_SIGNING_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: nulamp-arch
          path: dist/arch/*

  publish:
    name: Publish GitHub release
    needs: [version, build, appimage, deb, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Signed checksums and the public key
        env:
          NULAMP_SIGNING_KEY: ${{ secrets.NULAMP_SIGNING_KEY }}
        run: |
          cp packaging/nulamp-signing-key.asc dist/
          cd dist
          sha256sum * > SHA256SUMS
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$NULAMP_SIGNING_KEY" | gpg --batch --quiet --import
          gpg --batch --yes --armor --detach-sign SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: nulamp ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
      # jpsutton/arch-repo checks for new releases hourly; this makes it publish now.
      # Best effort: needs a token that can write to that repository.
      - name: Update the pacman repository
        env:
          ARCH_REPO_DISPATCH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$ARCH_REPO_DISPATCH_TOKEN" ]; then
            echo "::notice::ARCH_REPO_DISPATCH_TOKEN is not set; jpsutton/arch-repo picks up the release within the hour"
            exit 0
          fi
          GH_TOKEN=$ARCH_REPO_DISPATCH_TOKEN gh api repos/jpsutton/arch-repo/dispatches -f event_type=package-released \
            || echo "::warning::could not notify jpsutton/arch-repo; it picks up the release within the hour"
