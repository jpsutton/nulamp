[package]
name = "nulamp"
description = "Cross-platform player compatible with classic Winamp 2.x skins"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.deb]
maintainer = "Jared Sutton <jpsutton@protonmail.com>"
copyright = "the nulamp contributors"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = """\
nulamp plays music with classic Winamp 2.x skins (.wsz): main window, equalizer, playlist editor
and media library, with gapless playback, crossfade, ReplayGain and streams."""
section = "sound"
priority = "optional"
# $auto covers linked libraries; the X11 and keyboard libraries are loaded at run time.
depends = "$auto, libx11-6, libxcursor1, libxrandr2, libxi6, libxkbcommon-x11-0"
recommends = "fonts-dejavu-core"
assets = [
    ["target/release/nulamp", "usr/bin/", "755"],
    ["../../assets/linux/nulamp.desktop", "usr/share/applications/", "644"],
    ["../../assets/linux/nulamp.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../README.md", "usr/share/doc/nulamp/", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/nulamp/", "644"],
    ["../../include/nulamp_plugin.h", "usr/include/", "644"],
    ["../../docs/plugins.md", "usr/share/doc/nulamp/", "644"],
]

[dependencies]
encoding_rs = "0.8"
env_logger = "0.11.11"
log = "0.4.34"
nulamp-audio = { version = "0.1.0", path = "../../crates/nulamp-audio" }
nulamp-core = { version = "0.1.0", path = "../../crates/nulamp-core" }
nulamp-decoders = { version = "0.1.0", path = "../../crates/nulamp-decoders" }
nulamp-eq = { version = "0.1.0", path = "../../crates/nulamp-eq" }
nulamp-library = { version = "0.1.0", path = "../../crates/nulamp-library" }
nulamp-meta = { version = "0.1.0", path = "../../crates/nulamp-meta" }
nulamp-playlist = { version = "0.1.0", path = "../../crates/nulamp-playlist" }
nulamp-plugin-api = { version = "0.1.0", path = "../../crates/nulamp-plugin-api" }
nulamp-remote = { version = "0.1.0", path = "../../crates/nulamp-remote" }
nulamp-script = { version = "0.1.0", path = "../../crates/nulamp-script" }
nulamp-skin = { version = "0.1.0", path = "../../crates/nulamp-skin" }
nulamp-tf = { version = "0.1.0", path = "../../crates/nulamp-tf" }
nulamp-ui = { version = "0.1.0", path = "../../crates/nulamp-ui" }
nulamp-vis = { version = "0.1.0", path = "../../crates/nulamp-vis" }

[features]
# Audio CD playback through libcdio. Off by default: libcdio is GPL-3.0-or-later, so a binary
# built with this feature must be distributed under the GPL (docs/decisions.md CD1).
audio-cd = ["nulamp-decoders/cdio"]

[lints]
workspace = true
